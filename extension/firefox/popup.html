<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ReflexDesk Extension Setup</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      width: 280px;
      margin: 0;
      color: #1f2937;
      background: #f9fafb;
    }
    h2 { font-size: 15px; margin-top: 0; margin-bottom: 8px; }
    p { font-size: 12px; color: #4b5563; margin-bottom: 12px; }
    label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: #6b7280; display: block; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px; margin-bottom: 12px; font-family: monospace; }
    button { width: 100%; padding: 8px; background: #2563eb; color: #fff; border: none; border-radius: 4px; font-weight: 500; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .status { font-size: 11px; margin-top: 8px; text-align: center; }
    .status.ok { color: #059669; }
  </style>
</head>
<body>
  <h2>ReflexDesk Browser Bridge</h2>
  <p>Local automation pairing for ReflexDesk desktop AI controller.</p>
  <label for="secret">Pairing Secret</label>
  <input type="password" id="secret" placeholder="Enter desktop pairing secret" />
  <button id="save">Save & Connect</button>
  <div id="status" class="status"></div>
  <script src="popup.js"></script>
</body>
</html>
